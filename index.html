<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tazko</title>
    <script>
      // Sets the theme before the app paints, so a dark-mode user never sees a
      // white flash. The app re-applies it from the server preference later.
      (function () {
        try {
          var appearance = localStorage.getItem('tazko.appearance') || 'os'
          var dark =
            appearance === 'dark' ||
            (appearance === 'os' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.accent = localStorage.getItem('tazko.accent') || 'blue'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.dataset.accent = 'blue'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
